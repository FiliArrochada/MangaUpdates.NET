name: CI

# Build and test on every push to the main branch and on all pull requests.
# No packaging or publishing happens here — that's release.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # windows-latest: the library multi-targets net10.0;net48, and the net48
    # build/tests need the .NET Framework targeting pack + runtime.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MangaUpdates.sln

      - name: Build
        run: dotnet build MangaUpdates.sln -c Release --no-restore

      - name: Test
        run: dotnet test MangaUpdates.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"
          if-no-files-found: ignore
